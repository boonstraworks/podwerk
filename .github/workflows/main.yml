name: Build and package Podwerk

on: [push, pull_request]

jobs:
  test:
    name: Upgrade and smoke test (PHP ${{ matrix.php }})

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['7.0', '7.1', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
    - uses: actions/checkout@v4

    - uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: gettext, simplexml, curl
        tools: composer

    # The official 3.2.9 package needs PHP 7.1 or newer
    - name: Upgrade from Podcast Generator 3.2.9
      if: matrix.php != '7.0'
      run: bash tests/upgrade.sh php 8765

    - name: Smoke test on a fresh installation
      run: |
        cp -r PodcastGenerator /tmp/fresh
        (cd /tmp/fresh && composer install --no-dev --no-interaction --no-progress)
        php -d display_errors=1 -d error_reporting=-1 -S 127.0.0.1:8766 -t /tmp/fresh >/tmp/server.log 2>&1 &
        sleep 1
        bash tests/smoke.sh http://127.0.0.1:8766 admin 'Smoke-test-1'

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Check PHP syntax
      run: find PodcastGenerator -path PodcastGenerator/vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

    - name: Validate composer.json and composer.lock
      run: composer validate --strict --no-check-version
      working-directory: PodcastGenerator

    - name: Install runtime dependencies only
      run: composer install --prefer-dist --no-dev --no-progress --optimize-autoloader
      working-directory: PodcastGenerator

    - name: Check dependencies for known vulnerabilities
      run: composer audit --no-dev
      working-directory: PodcastGenerator

    - name: Compile message catalogs
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q gettext
        for po in PodcastGenerator/components/locale/*/LC_MESSAGES/messages.po; do
          msgfmt --check -o "${po%.po}.mo" "$po"
        done

    # GitHub zips everything in an upload-artifact action, so no other action
    # is needed to build the package. Hidden files are included because the
    # empty media/ and images/ folders only contain a .gitignore.
    - name: Upload build
      uses: actions/upload-artifact@v4
      with:
        name: Podwerk
        include-hidden-files: true
        path: |
          *
          **/*
          !.git
          !.github
          !.vscode
